[package]
name = "voicebot-rs"
version = "1.0.0"
edition = "2021"
description = "Rust rewrite of rsaga-trpg-voicebot (FastAPI app.py + config.py + step_clients.py)"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal", "time", "process", "net", "sync", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "stream", "rustls-tls", "gzip"] }
serde_json = "1"
bytes = "1"
futures-core = "0.3"
futures-util = { version = "0.3", default-features = false }
parking_lot = "0.12"
base64 = "0.22"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
rand = "0.8"

[dev-dependencies]
http-body-util = "0.1"
hyper = { version = "1.10", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "server-auto", "tokio"] }
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
